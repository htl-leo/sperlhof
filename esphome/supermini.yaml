esphome:
  name: supermini
  friendly_name: SuperMini

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "SuperMini Fallback"
    password: !secret wifi_ap_password

captive_portal:

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

# ─── Busse ────────────────────────────────────────────────────────────────────

i2c:
  id: i2c_bus
  sda: GPIO09
  scl: GPIO08
  scan: true

uart:
  id: uart_bus
  rx_pin: GPIO11
  tx_pin: GPIO10
  baud_rate: 256000

spi:
  id: spi_bus
  clk_pin: GPIO01
  mosi_pin: GPIO02

# ─── Komponenten ──────────────────────────────────────────────────────────────

ld2410:
  uart_id: uart_bus

# ─── Sensoren ─────────────────────────────────────────────────────────────────

sensor:
  - platform: sht4x
    i2c_id: i2c_bus
    temperature:
      id: sht41_temperature
      name: "Temperatur"
    humidity:
      id: sht41_humidity
      name: "Luftfeuchtigkeit"
    update_interval: 30s

  - platform: ld2410
    moving_distance:
      name: "Bewegungsdistanz"
    still_distance:
      name: "Ruhige Distanz"
    moving_energy:
      name: "Bewegungsenergie"
    still_energy:
      name: "Ruheenergie"
    detection_distance:
      name: "Erkennungsdistanz"

binary_sensor:
  - platform: ld2410
    has_target:
      name: "Ziel erkannt"
    has_moving_target:
      name: "Bewegtes Ziel"
    has_still_target:
      name: "Ruhiges Ziel"

# ─── Display ──────────────────────────────────────────────────────────────────

font:
  - file: "gfonts://Roboto"
    id: font_normal
    size: 24
  - file: "gfonts://Roboto"
    id: font_small
    size: 16

display:
  - platform: ili9xxx
    model: ST7789V
    spi_id: spi_bus
    dc_pin: GPIO04
    reset_pin: GPIO05
    cs_pin: GPIO03
    data_rate: 20MHz
    update_interval: 5s
    invert_colors: true
    rotation: 90
    dimensions:
      width: 240
      height: 320
    lambda: |-
      it.fill(Color::BLACK);
      it.printf(10, 20,  id(font_small),  Color(0xAA, 0xAA, 0xAA), "SuperMini");
      it.printf(10, 60,  id(font_normal), Color(0xFF, 0x80, 0x00), "%.1f °C",  id(sht41_temperature).state);
      it.printf(10, 100, id(font_normal), Color(0x00, 0xAA, 0xFF), "%.1f %%",   id(sht41_humidity).state);
